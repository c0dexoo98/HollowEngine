plugins { id 'java-library' }

def sdk = System.getenv('ANDROID_SDK_ROOT') ?: '/home/z/android-sdk'

dependencies {
    // compile against android.jar so render/audio backend classes compile;
    // on desktop JVM these classes are never loaded (headless CLI mode).
    compileOnly files("${sdk}/platforms/android-34/android.jar")
}

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

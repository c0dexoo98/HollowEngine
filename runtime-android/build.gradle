apply plugin: 'com.android.application'

def prop(String name, String defVal) {
    (project.hasProperty(name) ? project.property(name) : defVal).toString()
}

android {
    namespace 'com.hollow.runtime'
    compileSdk 34

    defaultConfig {
        applicationId prop('he.appId', 'com.hollow.runtime')
        minSdk 24
        targetSdk 34
        versionCode prop('he.versionCode', '1').toInteger()
        versionName prop('he.versionName', '1.0')
        manifestPlaceholders.appLabel = prop('he.appLabel', 'HollowEngine Game')
        manifestPlaceholders.orientation = prop('he.orientation', 'sensorLandscape')
    }

    signingConfigs {
        release {
            storeFile rootProject.file('tools/keys/hollow.jks')
            storePassword 'hollowengine'
            keyAlias 'hollow'
            keyPassword 'hollowengine'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation project(':engine')
}
